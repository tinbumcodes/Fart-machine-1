function inv(v,th,ph){let[x,y,z]=v,c=Math.cos(ph),s=Math.sin(ph);[x,z]=[x*c-z*s,x*s+z*c];c=Math.cos(th);s=Math.sin(th);return[x,y*c+z*s,-y*s+z*c]}
function cube(th,ph){
const e=ER[ei],H=[e.w/2,e.h/2,e.t/2],X=inv([1,0,0],th,ph),Y=inv([0,1,0],th,ph),Z=inv([0,0,1],th,ph),Nv=[[1,0,0],[0,1,0],[0,0,1]].map(v=>rot(v,th,ph)),d=IM.data,tx=TX[ei],h=BS/2;
d.fill(0);
for(let py=0;py<BS;py++)for(let px=0;px<BS;px++){
const sx=px-h+.5,sy=py-h+.5,o=[0,1,2].map(a=>sx*X[a]+sy*Y[a]-60*Z[a]);
let tn=-1e9,tf=1e9,ax=0,sg=1,ok=1;
for(let a=0;a<3;a++){
const da=Z[a];
if(Math.abs(da)<1e-6){if(Math.abs(o[a])>H[a]){ok=0;break}continue}
let t1=(-H[a]-o[a])/da,t2=(H[a]-o[a])/da;if(t1>t2)[t1,t2]=[t2,t1];
if(t1>tn){tn=t1;ax=a;sg=da>0?-1:1}
if(t2<tf)tf=t2}
if(!ok||tn>tf)continue;
const p=o.map((v,a)=>v+Z[a]*tn);let u,v,k;
if(ax===2){k=sg>0?1:0;u=p[0]+H[0];v=sg>0?H[1]-p[1]:p[1]+H[1]}
else if(ax===1){k=2;u=p[0]+H[0];v=sg>0?p[2]+H[2]:H[2]-p[2]}
else{k=sg>0?3:4;u=p[2]+H[2];v=p[1]+H[1]}
const T0=tx[k],xi=Math.min(T0.width-1,Math.max(0,u|0)),yi=Math.min(T0.height-1,Math.max(0,v|0)),q=(yi*T0.width+xi)*4;
if(T0.data[q+3]<128)continue;
const n=Nv[ax],dt=sg*(n[0]*LT[0]+n[1]*LT[1]+n[2]*LT[2]),m=dt>.6?1.12:dt>.3?.95:dt>0?.78:.6,i=(py*BS+px)*4;
d[i]=Math.min(255,T0.data[q]*m);d[i+1]=Math.min(255,T0.data[q+1]*m);d[i+2]=Math.min(255,T0.data[q+2]*m);d[i+3]=255}
const al=d.filter((_,i)=>i%4===3);
for(let py=0;py<BS;py++)for(let px=0;px<BS;px++){const j=py*BS+px;if(al[j])continue;
if((px>0&&al[j-1])||(px<BS-1&&al[j+1])||(py>0&&al[j-BS])||(py<BS-1&&al[j+BS])){const i=j*4;d[i]=OC[ei][0];d[i+1]=OC[ei][1];d[i+2]=OC[ei][2];d[i+3]=255}}
bx.putImageData(IM,0,0)}
function eraser(c,th,ph,hop,dx,hh){
const y=FY-hh-hop,sw=Math.round((64-hop*.5)/4)*4;
AL(c,.35,()=>{R(c,80-sw/2,FY+3,sw,4,'#000');R(c,80-sw/2+4,FY+1,sw-8,2,'#000')});
cube(th,ph);c.drawImage(BUF,Math.round(80-BS+dx),Math.round(y-BS),BS*S,BS*S)}
function frame(now){
requestAnimationFrame(frame);
if(document.hidden)return;
if(P.ph==='idle'&&now-(frame.l||0)<33)return;frame.l=now;
const t=now/1000,e=ER[ei];
let th=pm*PI+(edge?PI/2:0),hop=0,dx=0,hh=edge?e.t:e.h,ph=.45+.05*Math.sin(t);
if(P.ph==='go'){
const s=P.segs[P.i],p=Math.min(1,(now-P.t0)/s.d);
th=s.a0+(s.a1-s.a0)*(s.f?1-Math.pow(1-p,3):p);hop=reduce?0:Math.sin(PI*p)*s.h;hh=e.h;ph=.45+.35*Math.sin(now/170);dx=reduce||P.i?0:Math.round(Math.sin(p*PI*2)*3);
const n=Math.floor(th/PI);if(n!==P.n){P.n=n;SFX.tick(n)}
if(p>=1){SFX.land(P.i);if(++P.i>=P.segs.length)P={ph:'settle',t1:now,res:P.res,end:P.end};else P.t0=now}}
else if(P.ph==='settle'){
const ed=P.res===2,q=Math.min(1,(now-P.t1)/(ed?650:150)),tip=ed?1-Math.pow(1-q,3)*Math.cos(q*10):0;
th=P.end*PI+PI/2*tip;hh=e.h+(e.t-e.h)*tip;
if(q>=1){const r=P.res;pm=P.end;edge=ed;P={ph:'idle'};if(ed)SFX.land(1);finish(r)}}
BG[bi](ctx,t);if(party)lights(ctx,t);eraser(ctx,th+TILT,ph,hop,dx,hh)}
function toss(){
if(busy)return;busy=true;lock(true);
ac();
const b=crypto.getRandomValues(new Uint32Array(3)),u=b[2]/4294967296,res=b[0]/4294967296<MAYBE?2:(b[1]&1),tgt=res===2?(b[1]>>1&1):res,bn=u<.1?2:u<.35?1:0;
let k=8+2*Math.floor(Math.random()*3);if((pm+k+bn)%2!==tgt)k++;
const rp=pm*PI+(edge?PI/2:0),A1=(pm+k)*PI,segs=[{d:reduce?600:1600,h:64,a0:rp,a1:A1,f:1}];
for(let j=0;j<bn;j++)segs.push({d:j?300:380,h:j?10:22,a0:A1+j*PI,a1:A1+(j+1)*PI});
LB=bn;$('#msg').className='';$('#msg').textContent='Tossing...';
SFX.toss();P={ph:'go',segs,i:0,t0:performance.now(),n:0,res,end:pm+k+bn}}
function finish(r){
busy=false;lock(false);cnt[r]++;cnt.forEach((v,i)=>$('#n'+i).textContent=v);
const q=$('#q').value.trim(),w=['YES!','NO.','MAYBE...'][r];
$('#msg').className=['good','bad','may'][r];
$('#msg').textContent=(q?q+' ':'')+(r===2?'On its edge: ':'')+w+(LB?' (bounced '+(LB>1?'twice':'once')+')':'');
hist=[r,...hist].slice(0,8);
$('#hist').innerHTML=hist.map(x=>'<i style="background:'+['#1f7a3c','#b03a3a','#5a43c0'][x]+'">'+'YNM'[x]+'</i>').join('');
SFX[r]()}
function lock(b){document.querySelectorAll('.btn').forEach(x=>{if(x.id!=='party')x.disabled=b});$('#q').disabled=$('#es').disabled=$('#bs').disabled=b}
const es=$('#es'),bs=$('#bs');
ER.forEach((e,i)=>es.add(new Option(e.n,i)));BGN.forEach((n,i)=>bs.add(new Option(n,i)));
es.onchange=()=>{ei=+es.value;SFX.ui()};bs.onchange=()=>{bi=+bs.value;SFX.ui()};
$('#toss').onclick=toss;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')toss()});
$('#snd').onclick=e=>{mute=!mute;e.target.textContent='Sound: '+(mute?'off':'on')};
document.addEventListener('keydown',e=>{if(e.key===' '&&!['BUTTON','INPUT'].includes(e.target.tagName)){e.preventDefault();toss()}});
requestAnimationFrame(frame);
</script>
